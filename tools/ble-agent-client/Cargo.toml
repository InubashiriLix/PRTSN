[package]
name = "ble-agent-client"
version = "0.1.0"
edition = "2021"
description = "Linux BLE integration-test client for the PRTN Agent Panel"

[dependencies]
anyhow = "1"
btleplug = "0.11"
bluez-async = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = "1"
